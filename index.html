<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkBatch</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.7; }
  main { max-width: 760px; margin: 0 auto; padding: 64px 24px 80px; }
  h1 { font-size: 34px; margin-bottom: 8px; }
  .muted { color: #6b7280; }
  a { color: #2563eb; }
  .cards { display: grid; gap: 16px; margin-top: 32px; }
  .card { display: block; padding: 20px 22px; border: 1px solid #e5e7eb; border-radius: 14px; text-decoration: none; color: inherit; }
  .card:hover { border-color: #93c5fd; }
  .card strong { display: block; font-size: 18px; margin-bottom: 4px; }
</style>
</head>
<body>
<main>
  <h1>LinkBatch</h1>
  <p class="muted">多連結批次下載工具</p>
  <div class="cards">
    <a class="card" href="support.html">
      <strong>支援 / Support</strong>
      <span>使用說明、常見問題與聯絡方式</span>
    </a>
    <a class="card" href="privacy.html">
      <strong>隱私權政策 / Privacy Policy</strong>
      <span>LinkBatch 如何處理資料</span>
    </a>
  </div>
</main>
</body>
</html>
